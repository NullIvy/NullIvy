<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1622"/>
      <stop offset="1" stop-color="#0D1B2A"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.2" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#4FB3D9" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#4FB3D9" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.85" cy="0.9" r="0.6">
      <stop offset="0" stop-color="#85D4E3" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#85D4E3" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="txt" x1="0" x2="1">
      <stop offset="0" stop-color="#4FB3D9"/>
      <stop offset="0.5" stop-color="#E0F7FA"/>
      <stop offset="1" stop-color="#85D4E3"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#16304A" stroke-width="0.6"/>
    </pattern>
    <style>
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
      .sans{font-family:'Segoe UI',Inter,Helvetica,Arial,sans-serif}
      .blink{animation:b 1s steps(1) infinite}
      @keyframes b{50%{opacity:0}}
      .scan{animation:s 6s linear infinite}
      @keyframes s{from{transform:translateY(-20px)}to{transform:translateY(270px)}}
      .fade{animation:f 4s ease-in-out infinite alternate}
      @keyframes f{from{opacity:.55}to{opacity:1}}
    </style>
  </defs>

  <rect width="900" height="260" rx="14" fill="url(#bg)"/>
  <rect width="900" height="260" rx="14" fill="url(#grid)" opacity="0.6"/>
  <rect width="900" height="260" rx="14" fill="url(#glowA)"/>
  <rect width="900" height="260" rx="14" fill="url(#glowB)"/>
  <rect class="scan" x="0" y="0" width="900" height="2" fill="#4FB3D9" opacity="0.15"/>
  <rect x="0.5" y="0.5" width="899" height="259" rx="14" fill="none" stroke="#1D6A96"/>

  <!-- window dots -->
  <circle cx="26" cy="24" r="5" fill="#ff5f57"/>
  <circle cx="44" cy="24" r="5" fill="#febc2e"/>
  <circle cx="62" cy="24" r="5" fill="#28c840"/>
  <text x="84" y="28" class="mono" font-size="11" fill="#3E5466">~/nullivy/README.md</text>

  <text x="450" y="78" text-anchor="middle" class="mono" font-size="12" letter-spacing="6" fill="#7CC8E8">// STUDENT · TINKERER · UI/UX NERD</text>
  <text x="450" y="138" text-anchor="middle" class="sans fade" font-size="52" font-weight="800" fill="url(#txt)">NullIvy</text>
  <text x="450" y="172" text-anchor="middle" class="mono" font-size="15" fill="#CFE8F0">
    <tspan fill="#4FB3D9">❯</tspan> ngoprek dulu, paham belakangan<tspan class="blink" fill="#85D4E3">▌</tspan>
  </text>

  <!-- chips -->
  <g class="mono" font-size="11">
    <rect x="200" y="200" width="150" height="26" rx="13" fill="#0B1622" stroke="#4FB3D9" stroke-opacity="0.5"/>
    <text x="275" y="217" text-anchor="middle" fill="#B1F0F7">Terminal Ricing</text>
    <rect x="365" y="200" width="170" height="26" rx="13" fill="#0B1622" stroke="#C792EA" stroke-opacity="0.5"/>
    <text x="450" y="217" text-anchor="middle" fill="#D7AEF2">Web Dev &amp; UI/UX</text>
    <rect x="550" y="200" width="150" height="26" rx="13" fill="#0B1622" stroke="#7DDC8C" stroke-opacity="0.5"/>
    <text x="625" y="217" text-anchor="middle" fill="#9FE8AB">Data Mining</text>
  </g>
</svg>
