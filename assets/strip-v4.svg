<style>
.spin{animation:spin 80s linear infinite;transform-origin:500px 350px}@keyframes spin{to{transform:rotate(360deg)}}
.breathe{animation:br 5s ease-in-out infinite;transform-origin:500px 350px}@keyframes br{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:.9;transform:scale(1.05)}}
.draw{stroke-dasharray:400;stroke-dashoffset:400;animation:draw 2.4s ease-out forwards}@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:bl 3s ease-in-out infinite}@keyframes bl{0%,100%{opacity:.35}50%{opacity:1}}
.fade{animation:fd 2s ease-out both}@keyframes fd{from{opacity:0}to{opacity:1}}
.scan{animation:scan 6s ease-in-out infinite}@keyframes scan{0%,100%{transform:translate(0,0)}50%{transform:translate(18px,-12px)}}
.mq{animation:mq 20s linear infinite}@keyframes mq{to{transform:translateX(-500px)}}
